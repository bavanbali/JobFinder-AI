<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Jobs - JobFinder AI</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #101827;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            padding: 22px 14px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 45px;
            padding-left: 12px;
        }

        .logo span {
            color: #5146e5;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            padding: 13px 12px;
            border-radius: 9px;
            display: block;
            font-size: 15px;
        }

        .nav a:hover,
        .nav a.active {
            background: #5146e5;
        }

        .nav-bottom {
            position: absolute;
            bottom: 25px;
            left: 14px;
            right: 14px;
        }

        /* MAIN */
        .main {
            margin-left: 220px;
            width: calc(100% - 220px);
            padding: 32px;
            box-sizing: border-box;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            margin: 0;
            font-size: 30px;
            color: #0f172a;
        }

        .heading p {
            margin-top: 5px;
            color: #64748b;
        }

        .profile-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #5146e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* SEARCH */
        .search-box {
            background: white;
            border: 1px solid #dfe3eb;
            border-radius: 14px;
            padding: 16px;
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 100px;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .search-box input,
        .search-box select {
            height: 42px;
            border: 1px solid #d1d8e3;
            border-radius: 8px;
            padding: 0 13px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .search-box input:focus,
        .search-box select:focus {
            border-color: #5146e5;
        }

        .search-btn {
            border: none;
            background: #5146e5;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #4038c8;
        }

        /* FILTERS */
        .filters {
            display: flex;
            gap: 10px;
            margin: 22px 0;
            flex-wrap: wrap;
        }

        .filter {
            background: #eef2ff;
            color: #5146e5;
            padding: 10px 15px;
            border-radius: 22px;
            font-size: 14px;
            cursor: pointer;
        }

        .filter:hover {
            background: #dddfff;
        }

        .live {
            float: right;
            color: #00a86b;
            font-weight: bold;
        }

        /* JOB LIST */
        #jobsContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .job-card {
            background: white;
            border: 1px solid #dfe3eb;
            border-radius: 15px;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .job-title {
            font-size: 20px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 5px;
        }

        .company {
            color: #64748b;
            margin-bottom: 13px;
        }

        .job-info {
            display: flex;
            gap: 20px;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .skills {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .skill {
            background: #f1f3f7;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #172033;
        }

        .job-right {
            display: flex;
            align-items: center;
            gap: 16px;
            white-space: nowrap;
        }

        .match {
            background: #dcfce7;
            color: #009b5a;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .salary {
            font-weight: bold;
            color: #111827;
        }

        .apply-btn {
            background: #5146e5;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .apply-btn:hover {
            background: #4038c8;
        }

        .no-results {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
            color: #64748b;
        }

        /* MOBILE */
        @media (max-width: 900px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 20px;
            }

            .search-box {
                grid-template-columns: 1fr;
            }

            .job-card {
                grid-template-columns: 1fr;
            }

            .job-right {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .page {
                display: block;
            }

            .main {
                margin-left: 0;
                width: 100%;
            }

            .nav-bottom {
                position: static;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            💼 JobFinder <span>AI</span>
        </div>

        <nav class="nav">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="find-jobs.html" class="active">
                🔎 Find Jobs
            </a>

            <a href="ai-matches.html">
                🤖 AI Matches
            </a>

            <a href="saved-jobs.html">
                💗 Saved Jobs
            </a>

            <a href="applications.html">
                📄 Applications
            </a>

            <a href="resume.html">
                📄 My Resume
            </a>

            <a href="profile.html">
                👤 Profile
            </a>

        </nav>

        <div class="nav-bottom">

            <nav class="nav">

                <a href="settings.html">
                    ⚙️ Settings
                </a>

                <a href="#" id="logoutBtn">
                    🚪 Logout
                </a>

            </nav>

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main">

        <div class="topbar">

            <div class="heading">
                <h1>Find Jobs 🔎</h1>
                <p>Discover active jobs and apply directly.</p>
            </div>

            <div class="profile-circle">
                B
            </div>

        </div>


        <!-- SEARCH -->
        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search jobs, skills, companies..."
            >

            <input
                type="text"
                id="locationInput"
                placeholder="Location"
            >

            <select id="jobType">

                <option value="">
                    Job Type
                </option>

                <option value="Full Time">
                    Full Time
                </option>

                <option value="Part Time">
                    Part Time
                </option>

                <option value="Internship">
                    Internship
                </option>

            </select>

            <button
                id="searchButton"
                class="search-btn"
            >
                Search
            </button>

        </div>


        <!-- FILTERS -->
        <div class="filters">

            <div class="filter" data-filter="active">
                🔥 Active Jobs
            </div>

            <div class="filter" data-filter="fresher">
                🎓 Fresher Friendly
            </div>

            <div class="filter" data-filter="remote">
                💻 Remote
            </div>

            <div class="filter" data-filter="internship">
                🚀 Internship
            </div>

            <span class="live">
                🟢 LIVE
            </span>

        </div>


        <!-- JOBS -->
        <div id="jobsContainer"></div>

    </main>

</div>


<script src="js/find-jobs.js"></script>

</body>
</html>
