<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - JobFinder AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Create your account</h1>

            <p>
                Start finding better job opportunities today.
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerButton"
                class="primary-btn"
            >
                Create Account
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <button
            class="google-btn"
            type="button"
            onclick="alert('Google Login is not enabled yet. Enable Google provider in Firebase Authentication first.')"
        >
            🌐 Continue with Google
        </button>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <p class="terms">

            By creating an account, you agree to our
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>.

        </p>

    </div>


    <script
        type="module"
        src="js/register.js">
    </script>

</body>

</html>
