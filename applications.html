<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Applications - JobFinder AI</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 245px;
            background: #101827;
            color: white;
            padding: 25px 18px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .logo span {
            color: #6366f1;
        }

        .nav a {
            display: block;
            padding: 13px 12px;
            margin: 5px 0;
            color: #e5e7eb;
            text-decoration: none;
            border-radius: 9px;
        }

        .nav a:hover,
        .nav a.active {
            background: #4f46e5;
            color: white;
        }

        .main {
            margin-left: 245px;
            width: calc(100% - 245px);
            padding: 40px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 34px;
        }

        .page-header p {
            color: #64748b;
            margin-top: 7px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: #eef2ff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        .stat-label {
            color: #64748b;
            margin-top: 3px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 18px;
        }

        .section-header h2 {
            margin: 0;
        }

        .find-btn {
            background: #4f46e5;
            color: white;
            padding: 13px 20px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
        }

        .applications-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .application-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 25px;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
        }

        .application-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .application-header h2 {
            margin: 0 0 6px;
        }

        .application-header p {
            margin: 0;
            color: #64748b;
        }

        .status {
            background: #fff7ed;
            color: #ea580c;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .application-info {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 0;
            margin: 20px 0;
            color: #475569;
        }

        .applicant-info {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .applicant-info span {
            color: #475569;
        }

        .delete-application {
            position: absolute;
            right: 22px;
            bottom: 20px;
            border: none;
            background: #fff1f2;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .empty-applications {
            text-align: center;
            background: white;
            padding: 60px 20px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
        }

        .empty-applications h2 {
            margin-bottom: 8px;
        }

        .empty-applications p {
            color: #64748b;
        }

        .empty-applications a {
            display: inline-block;
            margin-top: 15px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 25px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .application-header {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            💼 JobFinder <span>AI</span>
        </div>

        <nav class="nav">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="find-jobs.html">
                🔎 Find Jobs
            </a>

            <a href="#">
                🤖 AI Matches
            </a>

            <a href="#">
                💗 Saved Jobs
            </a>

            <a
                href="applications.html"
                class="active"
            >
                📋 Applications
            </a>

            <a href="#">
                📄 My Resume
            </a>

            <a href="#">
                👤 Profile
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="page-header">

            <h1>
                My Applications 📋
            </h1>

            <p>
                Track all the jobs you have applied for.
            </p>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    📋
                </div>

                <div>

                    <div
                        class="stat-number"
                        id="totalApplications"
                    >
                        0
                    </div>

                    <div class="stat-label">
                        Total Applications
                    </div>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⏳
                </div>

                <div>

                    <div
                        class="stat-number"
                        id="pendingApplications"
                    >
                        0
                    </div>

                    <div class="stat-label">
                        Pending
                    </div>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ✅
                </div>

                <div>

                    <div
                        class="stat-number"
                        id="selectedApplications"
                    >
                        0
                    </div>

                    <div class="stat-label">
                        Selected
                    </div>

                </div>

            </div>

        </div>


        <!-- APPLICATIONS -->

        <div class="section-header">

            <div>

                <h2>
                    Recent Applications
                </h2>

            </div>

            <a
                href="find-jobs.html"
                class="find-btn"
            >
                🔎 Find More Jobs
            </a>

        </div>


        <div
            class="applications-container"
            id="applicationsContainer"
        ></div>

    </main>

</div>


<script src="js/applications.js"></script>

</body>

</html>
