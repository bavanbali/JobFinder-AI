<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - JobFinder AI</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="auth-page">


    <div class="auth-card">


        <div class="auth-header">

            <h1>
                Welcome back 👋
            </h1>

            <p>
                Login to continue to JobFinder AI.
            </p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="forgot-row">

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="primary-btn"
            >
                Login
            </button>


        </form>


        <div class="auth-divider">

            <span>OR</span>

        </div>


        <button
            type="button"
            class="google-btn"
            onclick="alert('Google Login is not enabled yet. Enable Google provider in Firebase Authentication first.')"
        >

            🌐 Continue with Google

        </button>


        <p class="auth-switch">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>


        <p class="terms">

            By continuing, you agree to our
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>.

        </p>


    </div>


    <script
        type="module"
        src="js/login.js">
    </script>

</body>

</html>
