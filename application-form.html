<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Job - JobFinder AI</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .application-page {
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .application-container {
            max-width: 900px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .page-header p {
            margin: 0;
            color: #64748b;
            font-size: 16px;
        }

        .job-box {
            background: #f4f2ff;
            border: 1px solid #ddd6fe;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 35px;
        }

        .job-box h2 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .job-company {
            color: #4f46e5;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .job-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            color: #475569;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .required {
            color: #ef4444;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 11px;
        }

        .file-note {
            margin-top: 7px;
            font-size: 13px;
            color: #64748b;
        }

        .button-row {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: white;
            border: 1px solid #cbd5e1;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        @media (max-width: 700px) {

            .application-page {
                padding: 20px 10px;
            }

            .application-container {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .button-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="application-page">

    <div class="application-container">

        <!-- HEADER -->
        <div class="page-header">
            <h1>📄 Apply for Job</h1>
            <p>
                Complete your details before submitting your application.
            </p>
        </div>


        <!-- JOB DETAILS -->
        <div class="job-box">

            <h2 id="jobTitle">Job Title</h2>

            <div class="job-company" id="jobCompany">
                Company
            </div>

            <div class="job-info">

                <span>
                    📍 <span id="jobLocation">Location</span>
                </span>

                <span>
                    💼 <span id="jobType">Job Type</span>
                </span>

                <span>
                    💰 <span id="jobSalary">Salary</span>
                </span>

            </div>

        </div>


        <!-- APPLICATION FORM -->
        <form id="applicationForm">


            <!-- PERSONAL INFORMATION -->
            <div class="section">

                <h2 class="section-title">
                    👤 Personal Information
                </h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Full Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email Address <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone Number <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter your city"
                        >

                    </div>

                </div>

            </div>


            <!-- EDUCATION -->
            <div class="section">

                <h2 class="section-title">
                    🎓 Education
                </h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Highest Qualification
                            <span class="required">*</span>
                        </label>

                        <select id="qualification" required>

                            <option value="">
                                Select qualification
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="B.E">
                                B.E
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="M.Tech">
                                M.Tech
                            </option>

                            <option value="MBA">
                                MBA
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Graduation Year
                        </label>

                        <input
                            type="number"
                            id="graduationYear"
                            placeholder="2027"
                            min="2000"
                            max="2100"
                        >

                    </div>

                </div>

            </div>


            <!-- SKILLS -->
            <div class="section">

                <h2 class="section-title">
                    💻 Skills
                </h2>

                <div class="form-group">

                    <label>
                        Your Skills <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="skills"
                        placeholder="Java, Python, SQL, HTML, CSS..."
                        required
                    >

                </div>

            </div>


            <!-- RESUME -->
            <div class="section">

                <h2 class="section-title">
                    📄 Resume
                </h2>

                <div class="form-group">

                    <label>
                        Resume <span class="required">*</span>
                    </label>

                    <input
                        type="file"
                        id="resume"
                        accept=".pdf,.doc,.docx"
                        required
                    >

                    <div class="file-note">
                        Accepted formats: PDF, DOC, DOCX
                    </div>

                </div>

            </div>


            <!-- COVER LETTER -->
            <div class="section">

                <h2 class="section-title">
                    ✉️ Cover Letter
                </h2>

                <div class="form-group">

                    <label>
                        Why should we hire you?
                    </label>

                    <textarea
                        id="coverLetter"
                        placeholder="Write a short message to the employer..."
                    ></textarea>

                </div>

            </div>


            <!-- BUTTONS -->
            <div class="button-row">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelButton"
                >
                    ← Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit Application →
                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/apply.js"></script>

</body>
</html>
